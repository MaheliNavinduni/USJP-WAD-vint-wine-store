    <ellipse cx="900" cy="220" rx="260" ry="260" fill="url(#story-hero-bloom-2)" />
  </g>

  <g opacity="0.16" fill="none" stroke="#b08d34" stroke-width="2">
    
    <g transform="translate(1180 300) scale(1.35)">
