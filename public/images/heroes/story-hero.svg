<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <defs>
    <linearGradient id="story-hero-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#430005" />
      <stop offset="55%" stop-color="#5b0b10" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </linearGradient>
    <radialGradient id="story-hero-bloom-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a1520" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7a1520" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="story-hero-bloom-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b08d34" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#b08d34" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="story-hero-bloom-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8e2b1f" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#8e2b1f" stop-opacity="0" />
    </radialGradient>
    <filter id="story-hero-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="42" />
    </filter>
    <filter id="story-hero-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#story-hero-base)" />

